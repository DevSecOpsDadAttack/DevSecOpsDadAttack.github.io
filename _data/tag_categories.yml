# Tag Index categorization
#
# Every tag used in _posts front matter (except MITRE ATT&CK technique IDs and
# CVE IDs, which tags.html auto-detects by pattern) must appear in exactly one
# list below. When you add a new tag to a post, add it here too, or it will
# fall into the "other" bucket by default.
#
# Buckets:
#   threat_actors     - named threat actors, APT groups, ransomware gangs
#   malware_tools     - malware families, RATs, loaders, offensive tools, LOLBins
#   vendors_products  - vendors, software products, SaaS platforms, dev tooling
#   threat_categories - attack types, techniques-as-concepts, risk domains
#   platform_os       - operating systems, directory infra, cloud/containers
#   sources           - research orgs / publications cited as report origin
#   other             - anything that doesn't cleanly fit the above (protocols,
#                        target environments, victim orgs, series/format tags)

