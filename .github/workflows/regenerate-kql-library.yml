name: Regenerate KQL Library

# Run this manually from the Actions tab any time you add or change
# queries in the attack-pack repo. Steps:
#   Actions → "Regenerate KQL Library" → "Run workflow" → "Run workflow"
# It clones attack-pack, runs the generator, and commits the refreshed
# kql-library/ pages + assets/kql/ downloads back to main. GitHub Pages
# then rebuilds the site automatically from that commit.
on:
  workflow_dispatch:

# Needed so the job can push a commit back to this repo.
permissions:
  contents: write

env:
  KQL_LIBRARY_REPO: DevSecOpsDadAttack/attack-pack
  KQL_LIBRARY_REF: main

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this site repo
        uses: actions/checkout@v4

      - name: Check out the KQL Library source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KQL_LIBRARY_REPO }}
          ref: ${{ env.KQL_LIBRARY_REF }}
          path: kql-library-src

      - name: Regenerate KQL Library pages
        run: bash scripts/build_kql_library.sh kql-library-src .

      - name: Commit and push refreshed pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only stage the paths the generator owns — never touch anything else.
          git add _data/kql_library.yml kql-library assets/kql

          if git diff --cached --quiet; then
            echo "No changes — attack-pack matches the deployed site."
            exit 0
          fi

          # Count what changed so the commit message tells the story.
          summary=$(git diff --cached --numstat | \
            awk '{added+=$1; deleted+=$2; files++} END { printf "%d file(s), +%d / -%d lines", files, added, deleted }')

          git commit -m "Regenerate KQL Library from attack-pack ($summary)"
          git push
